<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: #1e1b2e; background: #ffffff; -webkit-font-smoothing: antialiased; }
    a { color: #7c3aed; text-decoration: none; font-weight: 700; }
    a:hover { color: #6d28d9; }
    h1, h2 { font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: #faf8ff; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden;">

  <div style="position: absolute; width: 360px; height: 360px; border-radius: 50%; background: #fbcfe8; filter: blur(90px); opacity: 0.55; top: -130px; right: -110px;"></div>
  <div style="position: absolute; width: 320px; height: 320px; border-radius: 50%; background: #c4b5fd; filter: blur(90px); opacity: 0.55; bottom: -140px; left: -90px;"></div>
  <div style="position: absolute; width: 240px; height: 240px; border-radius: 50%; background: #bae6fd; filter: blur(90px); opacity: 0.45; top: 80px; right: 160px;"></div>

  <div style="position: absolute; top: 32px; left: 36px; display: flex; align-items: center; gap: 10px; z-index: 2;">
    <div style="width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(160deg, #a78bfa, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(124,58,237,0.35);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.02em;">SnapTask</span>
  </div>

  <div style="width: 400px; background: #ffffff; border: 1px solid #efeafb; border-radius: 20px; padding: 36px; box-shadow: 0 24px 60px rgba(124,58,237,0.12); position: relative; z-index: 2;">
    <h1 style="margin: 0 0 8px; font-size: 24px; font-weight: 800; letter-spacing: -0.025em;">Create your account</h1>
    <p style="margin: 0 0 26px; font-size: 14px; color: #6e6a83; line-height: 1.5;">Free to start. Bring your team in minutes.</p>

    <label style="display: block; margin-bottom: 16px;">
      <span style="display: block; font-size: 12.5px; font-weight: 700; color: #4a4760; margin-bottom: 7px;">Name</span>
      <div style="height: 44px; border: 1.5px solid #e7e2f5; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-size: 14px; color: #a5a1b8; background: #fdfcff;">Sai Ramadoss</div>
    </label>

    <label style="display: block; margin-bottom: 16px;">
      <span style="display: block; font-size: 12.5px; font-weight: 700; color: #4a4760; margin-bottom: 7px;">Email</span>
      <div style="height: 44px; border: 1.5px solid #e7e2f5; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-size: 14px; color: #a5a1b8; background: #fdfcff;">you@example.com</div>
    </label>

    <label style="display: block; margin-bottom: 24px;">
      <span style="display: block; font-size: 12.5px; font-weight: 700; color: #4a4760; margin-bottom: 7px;">Password</span>
      <div style="height: 44px; border: 1.5px solid #e7e2f5; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-size: 14px; color: #a5a1b8; background: #fdfcff;">At least 8 characters</div>
    </label>

    <button style="width: 100%; height: 46px; background: linear-gradient(180deg, #8b5cf6, #7c3aed); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 8px 20px rgba(124,58,237,0.35);">Create account</button>

    <p style="margin: 20px 0 0; font-size: 13.5px; color: #6e6a83; text-align: center;">Already have an account? <a href="#">Log in</a></p>
  </div>

</div>
</x-dc>
</body>
</html>
