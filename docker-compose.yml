# Local dev infrastructure for SnapTask.
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v   (also deletes the data volumes)

name: snaptask

services:
  postgres:
    image: postgres:15-alpine
    container_name: snaptask-db
    environment:
      POSTGRES_USER: snaptask_user
      POSTGRES_PASSWORD: snaptask_password
      POSTGRES_DB: snaptask_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: snaptask-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
